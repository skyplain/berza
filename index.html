      try {

          document.documentElement.dataset.theme = t;
          if (t !== "light" && t !== "dark")

        }

        const t = document.createElement("template");
        t.innerHTML = html;
        const same = (a, b) => a.nodeType === b.nodeType && a.nodeName === b.nodeName && (a.nodeType !== 1 || a.id === b.id);
        const node = (a, b) => {
          if (a.nodeType !== 1) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
          for (const x of [...a.attributes]) if (!b.hasAttribute(x.name)) a.removeAttribute(x.name);
          for (const x of b.attributes) if (a.getAttribute(x.name) !== x.value) a.setAttribute(x.name, x.value);
          kids(a, b);
        };
        const kids = (from, to) => {
          let a = from.firstChild, b = to.firstChild;
          while (b) {
            const nb = b.nextSibling;
            if (a && same(a, b)) { node(a, b); a = a.nextSibling; }
            else if (a) { const na = a.nextSibling; from.replaceChild(b, a); a = na; }

      };
